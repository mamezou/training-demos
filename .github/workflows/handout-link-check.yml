name: 配布資料のリンク切れ検査

# 配布資料 (az900-handout、gh900-handout、ms4018-handout、tess-handout から移したもの) の
# Markdown のリンクを検査する。
on:
  push:
    branches: [main]
    paths:
      - "aws/aws-fundamentals/technical-essentials-handout/**/*.md"
      - "azure/az900/handout/**/*.md"
      - "azure/ms4018/handout/**/*.md"
      - "github/gh900/handout/**/*.md"
      - ".lycheeignore"
      - ".github/workflows/handout-link-check.yml"
  pull_request:
    paths:
      - "aws/aws-fundamentals/technical-essentials-handout/**/*.md"
      - "azure/az900/handout/**/*.md"
      - "azure/ms4018/handout/**/*.md"
      - "github/gh900/handout/**/*.md"
      - ".lycheeignore"
      - ".github/workflows/handout-link-check.yml"
  # Markdown を変えなくても外部のリンク先は消えるので、週に1回も確かめる
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 9:00 (JST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # コードブロックとインラインコードの中の URL は検査しない (lychee の既定)。
      # 429 (アクセス過多) はリンク切れではないので成功扱いにする。
      # 除外する URL とその理由は .lycheeignore に書く。
      - name: リンクを検査する
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 3
            --timeout 30
            --accept 200..=299,429
            "./aws/aws-fundamentals/technical-essentials-handout/**/*.md"
            "./azure/az900/handout/**/*.md"
            "./azure/ms4018/handout/**/*.md"
            "./github/gh900/handout/**/*.md"
          fail: true
